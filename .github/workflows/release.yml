name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    name: Verify release ref
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc|alpha)(\.?[0-9]*)?)?$ ]]; then
            echo "Unsupported release tag format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          COMMIT_SHA="$(git rev-parse 'HEAD^{commit}')"
          RELATION="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...main" --jq '.status + ":" + .merge_base_commit.sha')"
          if [[ "$RELATION" != "identical:$COMMIT_SHA" && "$RELATION" != "ahead:$COMMIT_SHA" ]]; then
            echo "Release tag does not point to a commit on main" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"

          if ! grep -Eq "^## \\[$VERSION\\]" CHANGELOG.md && ! grep -Eq "^## \\[$BASE_VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release entry for $VERSION or $BASE_VERSION" >&2
            exit 1
          fi

  build:
    name: Build osu! Trackpad Driver
    needs: preflight
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find swift

      - name: Build app
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Package app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            osu-thing.app \
            "osu-thing-v${VERSION}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: osu-thing-release
          path: "*.zip"

  release:
    name: Create Release
    needs: [preflight, build]
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: osu-thing-release
          path: artifacts

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"

          TARGET_VERSION="$VERSION"
          if ! grep -Eq "^## \\[$TARGET_VERSION\\]" CHANGELOG.md; then
            TARGET_VERSION="$BASE_VERSION"
          fi

          awk -v version="$TARGET_VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
              next
            }
            found && $0 ~ "^## \\[" {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry found for v${TARGET_VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          CREATE_ARGS=(
            "${GITHUB_REF_NAME}"
            artifacts/*.zip
            --title "${GITHUB_REF_NAME}"
            --notes-file RELEASE_NOTES.md
          )

          if [[ "$VERSION" =~ -(beta|rc|alpha) ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          gh release create "${CREATE_ARGS[@]}"
